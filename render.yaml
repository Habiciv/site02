services:
  - type: web
    name: rng-centro-comando
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: OWNER_EMAIL
        sync: false
      - key: INITIAL_OWNER_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: SYNC_API_KEY
        sync: false
    disk:
      name: rng-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
  - type: worker
    name: rng-discord-bot
    runtime: node
    buildCommand: npm install
    startCommand: npm run bot
    envVars:
      - key: DISCORD_BOT_TOKEN
        sync: false
      - key: SITE_URL
        sync: false
      - key: SYNC_API_KEY
        sync: false
